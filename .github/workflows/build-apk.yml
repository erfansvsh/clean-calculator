name: Build Android App & Play Store Bundle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Prepare Signing Keystore
      run: |
        if [ ! -f release-key.jks ]; then
          echo "Generating automated release signing key for Google Play Store..."
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -alias clean-calculator \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "CleanCalcStore2025" \
            -keypass "CleanCalcStore2025" \
            -dname "CN=Clean Calculator, OU=Mobile, O=CleanCalculator, L=San Francisco, S=CA, C=US"
        fi

    - name: Build Debug APK
      run: gradle :app:assembleDebug --stacktrace --no-daemon

    - name: Build Release APK
      run: gradle :app:assembleRelease --stacktrace --no-daemon

    - name: Build Play Store AAB Bundle
      run: gradle :app:bundleRelease --stacktrace --no-daemon

    - name: Upload Play Store AAB Bundle (.aab)
      uses: actions/upload-artifact@v4
      with:
        name: Clean-Calculator-PlayStore-AAB
        path: app/build/outputs/bundle/release/*.aab
        retention-days: 30

    - name: Upload Release APK (.apk)
      uses: actions/upload-artifact@v4
      with:
        name: Clean-Calculator-Release-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Upload Debug APK (.apk)
      uses: actions/upload-artifact@v4
      with:
        name: Clean-Calculator-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Backup Keystore (Keep this safe!)
      uses: actions/upload-artifact@v4
      with:
        name: Release-Keystore-Backup
        path: release-key.jks
        retention-days: 30
